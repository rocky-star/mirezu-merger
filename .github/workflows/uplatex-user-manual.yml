name: Deply User's Manual to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [ "trunk" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            scheme-basic uplatex ctex geometry fancyvrb hyperref
      - name: Cache TeX fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: /usr/local/texlive/texmf-local/fonts
          key: founder-ctex-fonts
      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: Install fonts
        env:
          FONTS_DIR: /usr/local/texlive/texmf-local/fonts/truetype/founder/ctex
        run: |
          sudo mkdir -p $FONTS_DIR
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZFSK.TTF
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZHTK.TTF
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZKTK.TTF
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZLSK.TTF
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZSSK.TTF
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZXBSK.TTF
          sudo curl -LO --output-dir $FONTS_DIR https://file.luxing.im/FZXH1K.TTF
          sudo curl -LO --output-dir $FONTS_DIR http://d.xiazaiziti.com/fonts/fangzhengfonts/FZY1K.TTF
          sudo curl -LO --output-dir $FONTS_DIR http://d.xiazaiziti.com/fonts/fangzhengfonts/FZY3K.TTF
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with upLaTeX and Dvipdfmx
        run: |
          sudo mktexlsr
          uplatex docs/manual.zh-cn.tex
          uplatex docs/manual.zh-cn.tex
          dvipdfmx docs/manual.zh-cn.dvi
          mkdir docs-build
          mv docs/manual.zh-cn.pdf docs-build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
